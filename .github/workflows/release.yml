name: Release

on:
  push:
    tags: ["v*"]

permissions: {}

jobs:
  gate:
    # Rerun the full pull request checks (lint, types, tests on 3.11 to 3.13, package)
    # on the tagged commit before anything is built for release.
    permissions:
      contents: read
    uses: ./.github/workflows/test.yml

  build:
    needs: gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check tagged commit is on main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA^{commit}" origin/main; then
            echo "::error::Tagged commit $GITHUB_SHA is not on main. Tag a commit that has been merged to main."
            exit 1
          fi
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install build tools
        run: pip install --only-binary ':all:' --require-hashes -r .github/requirements/release.txt
      - name: Build
        run: python -m build --no-isolation
      - name: Check sdist contents
        run: python scripts/check_sdist.py dist/*.tar.gz
      - name: Check tag matches version
        env:
          TAG: ${{ github.ref_name }}
        run: python scripts/check_release.py "$TAG" dist/*
      - name: Check metadata
        run: twine check --strict dist/*
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish-testpypi:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/openpickleball-engine
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          repository-url: https://test.pypi.org/legacy/
