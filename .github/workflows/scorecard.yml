# Runs OpenSSF Scorecard and publishes the results (https://scorecard.dev).
# Results also appear under Security > Code scanning.
# The Scorecard API rejects published results unless this workflow keeps
# to its rules: no workflow-level write permissions or env, and only the
# approved actions in the analysis job.
name: Scorecard

on:
  # Rerun when branch protection changes, since it is one of the checks.
  branch_protection_rule:
  schedule:
    - cron: "30 6 * * 1"
  push:
    branches: [main]
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # Upload the results to code scanning.
      security-events: write
      # Publish the results and the badge.
      id-token: write
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@23f22cd43608bae7a1f1fa2603d7314dee9538a5 # v2.6.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: github/codeql-action/upload-sarif@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          sarif_file: results.sarif
