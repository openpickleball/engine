name: Tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Check formatting
        run: ruff format --check .
      - name: Type check
        run: mypy src

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: pip install -e ".[dev]"
      # Coverage tracing roughly triples the suite's run time, so only one
      # version collects it. The others run the same tests without it.
      - name: Test
        if: matrix.python-version != '3.13'
        run: pytest -n auto
      - name: Test with coverage
        if: matrix.python-version == '3.13'
        run: pytest -n auto --cov

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install build tools
        run: pip install --only-binary ':all:' --require-hashes -r .github/requirements/release.txt
      - name: Build
        run: python -m build --no-isolation
      - name: Check sdist contents
        run: python scripts/check_sdist.py dist/*.tar.gz
      - name: Check wheel contents
        run: python scripts/check_wheel.py dist/*.whl
      # Installs the built wheel alone into a clean virtual environment and loads
      # every published parameter set from it. -I keeps the checkout off sys.path.
      - name: Load parameter sets from the installed wheel
        run: |
          python -m venv "$RUNNER_TEMP/wheel-venv"
          "$RUNNER_TEMP/wheel-venv/bin/python" -m pip install --no-index --no-deps dist/*.whl
          "$RUNNER_TEMP/wheel-venv/bin/python" -I scripts/check_installed_wheel.py
      - name: Check metadata
        run: twine check --strict dist/*
